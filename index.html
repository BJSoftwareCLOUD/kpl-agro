<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KPL AGRO · Ventas y exportación</title>
<meta name="theme-color" content="#10291D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KPL AGRO">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2310291D'/%3E%3Cpath d='M22 24c-6 10-4 26 8 30 8 3 16-2 14-8-2-5-8-6-10-12-1-4 0-8-2-10-3-3-7-3-10 0z' fill='%23E5332A'/%3E%3Cpath d='M30 22c0-6 4-10 10-11' stroke='%233FB37A' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F6F1; --surface:#FFFFFF; --surface-2:#EDF2EA; --surface-3:#E3EBDF;
  --ink:#13211A; --ink-2:#34443B; --muted:#617066; --line:#DAE3D6; --line-2:#C8D4C3;
  --brand:#1E6B45; --brand-2:#17573A; --brand-soft:#DDEFE3; --on-brand:#FFFFFF;
  --chili:#D4271F; --chili-2:#B51E17; --chili-soft:#FBE3DF;
  --sun:#C98A00; --sun-soft:#FBEFCF; --sky:#1F6FB2; --sky-soft:#DDEBF7;
  --side:#10291D; --side-ink:#D5E6DA; --side-muted:#86A291; --side-hi:#1B3D2B;
  --shadow:0 1px 2px rgba(16,41,29,.06),0 8px 24px -12px rgba(16,41,29,.18);
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --r-lg:18px; --r:12px; --r-sm:9px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1611; --surface:#132019; --surface-2:#192920; --surface-3:#21342A;
    --ink:#E6EFE8; --ink-2:#C2D0C7; --muted:#8FA397; --line:#24372C; --line-2:#30473A;
    --brand:#3FB37A; --brand-2:#5CC690; --brand-soft:#173826; --on-brand:#06140C;
    --chili:#FF5A4E; --chili-2:#FF7A70; --chili-soft:#3A1A17;
    --sun:#F2B630; --sun-soft:#3A2F12; --sky:#62A8E8; --sky-soft:#142C42;
    --side:#08110C; --side-ink:#D5E6DA; --side-muted:#7E9888; --side-hi:#15291E;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1611; --surface:#132019; --surface-2:#192920; --surface-3:#21342A;
  --ink:#E6EFE8; --ink-2:#C2D0C7; --muted:#8FA397; --line:#24372C; --line-2:#30473A;
  --brand:#3FB37A; --brand-2:#5CC690; --brand-soft:#173826; --on-brand:#06140C;
  --chili:#FF5A4E; --chili-2:#FF7A70; --chili-soft:#3A1A17;
  --sun:#F2B630; --sun-soft:#3A2F12; --sky:#62A8E8; --sky-soft:#142C42;
  --side:#08110C; --side-ink:#D5E6DA; --side-muted:#7E9888; --side-hi:#15291E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
img{max-width:100%}
svg[aria-hidden="true"]{width:18px;height:18px;flex:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;line-height:1.15}
h1{font-size:clamp(1.6rem,1.2rem + 1.4vw,2.15rem);font-weight:800}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
.num,td.n,.money{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.84rem} .tiny{font-size:.76rem}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Precarga ---------- */
#splash{position:fixed;inset:0;z-index:500;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:opacity .35s ease,visibility .35s}
#splash.out{opacity:0;visibility:hidden}
#splash .sp-badge{width:168px;height:168px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 8px color-mix(in srgb,var(--brand) 10%,transparent),0 24px 50px -20px rgba(16,41,29,.35);animation:spIn .6s cubic-bezier(.2,.8,.2,1) both}
#splash .sp-badge svg{width:62%;height:auto}
#splash .sp-bar{width:120px;height:4px;border-radius:9px;background:var(--surface-3);overflow:hidden}
#splash .sp-bar i{display:block;width:40%;height:100%;border-radius:9px;background:var(--brand);animation:spLoad 1.1s ease-in-out infinite}
@keyframes spIn{from{opacity:0;transform:scale(.9)}}
@keyframes spLoad{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
/* ---------- Login ---------- */
#root{height:100%}
.login{height:100%;display:grid;grid-template-columns:1.1fr 1fr;background:var(--surface);overflow:hidden}
.login-art{background:var(--side);color:#fff;padding:clamp(22px,4.5vh,44px) clamp(28px,5vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:16px;position:relative;overflow:hidden;min-height:0}
.login-art .lg-top{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.login-art .lg-top b{font-family:var(--display);font-size:1.08rem;color:#fff;letter-spacing:.03em;display:block;line-height:1.1}
.login-art .lg-top small{color:var(--side-muted);font-size:.78rem}
.login-art .mid{display:flex;flex-direction:column;gap:clamp(14px,3vh,28px);position:relative;z-index:1}
.login-art .word{font-family:var(--display);font-weight:800;font-size:clamp(3.2rem,min(10vw,14vh),8.6rem);line-height:.86;letter-spacing:-.045em;color:#F4F1E8}
.login-art .word span{display:block;color:var(--chili)}
.login-art .word span:last-child{color:#5CC690}
.login-art .pep{position:absolute;right:-50px;bottom:-40px;width:min(34vw,380px);height:auto;opacity:.9;transform:rotate(-18deg)}
.pep-dot{display:inline-block;width:.34em;height:.68em;margin-left:.1em;vertical-align:-.02em;transform:rotate(-14deg);transform-origin:50% 90%}
.pep-dot svg{width:100%;height:100%;display:block}
.client-logo{display:flex;justify-content:center;margin-bottom:2px}
.client-logo svg,.client-logo img{width:clamp(70px,13vh,104px);height:auto;max-height:clamp(100px,19vh,150px);object-fit:contain}
.login-form{display:flex;align-items:center;justify-content:center;padding:clamp(18px,3vh,36px) 24px;overflow-y:auto;min-height:0}
.login-form form{width:min(400px,100%);display:grid;gap:12px}
.demo-users{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.demo-users button{display:grid;gap:2px;padding:9px 10px;border:1px dashed var(--line-2);border-radius:var(--r);background:var(--surface-2);cursor:pointer;text-align:left;min-width:0}
.demo-users button b{font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demo-users button small{font-size:.72rem;color:var(--muted)}
.demo-users button:hover{border-color:var(--brand)}
.credit{display:grid;justify-items:center;gap:4px;font-size:.76rem;color:var(--muted);text-align:center;margin-top:6px}
.bjword{display:inline-flex;align-items:center;gap:7px;font-size:1.3rem;line-height:1}
.bjword .bj{font-family:var(--display);font-weight:800;color:#F28C1B;letter-spacing:-.02em}
.bjword .sw{font-family:Georgia,"Times New Roman",serif;color:var(--ink);display:inline-flex;align-items:center}
.bjword .sw svg{width:.78em;height:.78em;margin:0 .02em;color:var(--ink)}
@media (max-width:820px){
  .login{grid-template-columns:1fr;height:auto;min-height:100%;overflow:visible}
  .login-art{display:none}
  .login-art .word{font-size:clamp(2rem,9vw,2.6rem);line-height:1}
  .login-art .word span{display:inline}
  .login-art .pep{display:none}
  .login-art .lg-top small{display:none}
  .client-logo svg,.client-logo img{width:92px;max-height:136px}
  .client-logo{margin-bottom:8px}
  .login-form form{gap:10px}
  .login-form{min-height:100%;padding:28px 20px 24px;overflow:visible;align-items:center}
}
/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:262px 1fr;min-height:100vh;min-height:100dvh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;z-index:30}
.brand{display:flex;align-items:center;gap:12px;padding:20px 20px 14px}
.brand .mark{width:40px;height:40px;border-radius:12px;background:#0A1A12;display:grid;place-items:center;flex:none;overflow:hidden}
.brand .mark img{width:100%;height:100%;object-fit:cover}
.brand b{font-family:var(--display);font-size:1.08rem;color:#fff;display:block;line-height:1.1}
.brand small{color:var(--side-muted);font-size:.76rem}
.nav{flex:1;overflow-y:auto;padding:6px 12px 16px;scrollbar-width:thin;scrollbar-color:var(--side-hi) transparent}
.nav .grp{color:var(--side-muted);font-size:.78rem;font-weight:600;padding:16px 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;color:var(--side-ink);text-decoration:none;font-weight:500;position:relative}
.nav a svg{width:19px;height:19px;opacity:.8;flex:none}
.nav a:hover{background:var(--side-hi)}
.nav a.on{background:#F4F1E8;color:#10291D;font-weight:700}
.nav a.on svg{opacity:1;color:var(--chili)}
.nav a .count{margin-left:auto;font-size:.72rem;background:var(--chili);color:#fff;border-radius:99px;padding:1px 7px;font-weight:700}
.side-user{display:flex;align-items:center;gap:10px;padding:14px 16px;border-top:1px solid var(--side-hi)}
.side-user .who{flex:1;min-width:0}
.side-user .who b{display:block;color:#fff;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-user .who small{color:var(--side-muted);font-size:.76rem}
.side-user button{background:none;border:0;color:var(--side-muted);cursor:pointer;padding:8px;border-radius:8px}
.side-user button:hover{background:var(--side-hi);color:#fff}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.82rem;flex:none;background:var(--chili);color:#fff}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px clamp(16px,3vw,32px);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .crumb{font-weight:600;color:var(--muted);font-size:.9rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .crumb b{color:var(--ink)}
.search-btn{display:flex;align-items:center;gap:10px;min-width:240px;padding:8px 12px;border:1px solid var(--line);background:var(--surface);border-radius:10px;color:var(--muted);cursor:pointer}
.search-btn kbd{margin-left:auto;font:600 .72rem var(--font);border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--surface-2)}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer;color:var(--ink-2);flex:none}
.icon-btn:hover{border-color:var(--line-2);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.sync{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);padding:0 4px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--sun)}
.sync.cloud i{background:var(--brand)}
.view{padding:clamp(16px,3vw,32px);padding-bottom:120px;max-width:1440px;width:100%;margin:0 auto;outline:none}
.vhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:22px}
.vhead p{margin:4px 0 0;color:var(--muted)}
.vhead .acts{display:flex;gap:8px;flex-wrap:wrap}
.bottom{display:none}
.scrim{display:none}

/* ---------- Controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink);transition:background .15s,border-color .15s,transform .05s}
.btn:hover{border-color:var(--line-2);background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn svg{width:17px;height:17px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.pri:hover{background:var(--brand-2)}
.btn.hot{background:var(--chili);border-color:var(--chili);color:#fff}
.btn.hot:hover{background:var(--chili-2)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--chili);border-color:color-mix(in srgb,var(--chili) 35%,var(--line))}
.btn.danger:hover{background:var(--chili-soft)}
.btn.sm{height:32px;padding:0 10px;font-size:.84rem;border-radius:8px}
.btn.icon{width:34px;padding:0;height:34px}
.btn[disabled]{opacity:.5;pointer-events:none}
.field{display:grid;gap:6px;min-width:0}
.field>span{font-size:.82rem;font-weight:600;color:var(--ink-2)}
.input,select.input,textarea.input{width:100%;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);outline:none;transition:border-color .15s,box-shadow .15s}
textarea.input{height:auto;min-height:80px;padding:10px 12px;resize:vertical}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)}
.input.err{border-color:var(--chili)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}
.seg{display:inline-flex;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted);font-size:.88rem}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.searchbox{position:relative;flex:1;min-width:200px}
.searchbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.searchbox .input{padding-left:38px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}

/* ---------- Panels & KPIs ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.panel>header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.panel.flush{padding:0}
.panel.flush>header{padding:16px 18px 0;margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;display:grid;gap:6px;position:relative;overflow:hidden}
.kpi .lbl{color:var(--muted);font-weight:600;font-size:.86rem;display:flex;align-items:center;gap:8px}
.kpi .lbl svg{width:16px;height:16px}
.kpi .val{font-family:var(--display);font-weight:700;font-size:clamp(1.3rem,1rem + 1vw,1.75rem);letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .delta{font-size:.8rem;font-weight:600}
.up{color:var(--brand)} .down{color:var(--chili)}
.kpi.feature{background:var(--side);border-color:var(--side);color:#F4F1E8}
.kpi.feature .lbl,.kpi.feature .delta{color:#A9C4B3}
.kpi.feature .delta.up{color:#7BE0A8}
.kpi.feature .delta.down{color:#FF9A90}
.dash{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
.dash .col{display:grid;gap:16px;align-content:start;min-width:0}
.hello{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px}
.hello h1 em{font-style:normal;color:var(--muted);font-weight:500}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.legend{display:flex;gap:14px;font-size:.82rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart svg{width:100%;height:auto;display:block}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:.8rem;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .12s}
.bars{display:grid;gap:12px}
.bar-row{display:grid;gap:5px}
.bar-row .t{display:flex;justify-content:space-between;gap:10px;font-size:.88rem}
.bar-row .t span:first-child{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:8px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.feed{display:grid}
.feed a{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:10px 18px;color:inherit;text-decoration:none;border-top:1px solid var(--line);cursor:pointer}
.feed a:hover{background:var(--surface-2)}
.feed .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.feed .ic svg{width:18px;height:18px}
.feed b{display:block;font-size:.92rem}
.feed small{color:var(--muted);font-size:.8rem}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}
.empty svg{width:40px;height:40px;opacity:.5;margin-bottom:8px}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* Heat meter: the signature stock gauge */
.heat{display:flex;gap:3px;align-items:center}
.heat i{width:9px;height:14px;border-radius:5px 5px 6px 6px;background:var(--surface-3)}
.heat.l1 i:nth-child(-n+1){background:var(--chili)}
.heat.l2 i:nth-child(-n+2){background:#E5672A}
.heat.l3 i:nth-child(-n+3){background:var(--sun)}
.heat.l4 i:nth-child(-n+4){background:#7FB24A}
.heat.l5 i:nth-child(-n+5){background:var(--brand)}
.heat em{font-style:normal;font-size:.8rem;color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface)}
table.t{width:100%;border-collapse:collapse;font-size:.9rem}
table.t th{text-align:left;font-weight:600;color:var(--muted);font-size:.8rem;padding:11px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr{transition:background .1s}
table.t tbody tr.click{cursor:pointer}
table.t tbody tr.click:hover{background:var(--surface-2)}
table.t .r,table.t th.r{text-align:right}
table.t td.n{text-align:right;white-space:nowrap}
.cell-main{display:flex;align-items:center;gap:12px;min-width:0}
.cell-main b{display:block;font-weight:600}
.cell-main small{color:var(--muted);font-size:.8rem}
.thumb{width:44px;height:44px;border-radius:10px;overflow:hidden;background:var(--surface-2);flex:none;display:grid;place-items:center;cursor:zoom-in;border:1px solid var(--line);padding:0}
.thumb img,.thumb svg{width:100%;height:100%;object-fit:cover}
.row-acts{display:flex;gap:4px;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:.76rem;font-weight:700;white-space:nowrap;background:var(--surface-3);color:var(--ink-2)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--brand-soft);color:var(--brand)}
.chip.warn{background:var(--sun-soft);color:var(--sun)}
.chip.bad{background:var(--chili-soft);color:var(--chili)}
.chip.info{background:var(--sky-soft);color:var(--sky)}
.chip.plain::before{display:none}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 4px;color:var(--muted);font-size:.85rem;flex-wrap:wrap}
.pager b{color:var(--ink);font-weight:700}
.pg-ctl{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pg-b{min-width:32px;padding:0 8px}
select.input.pg-size{height:32px;width:auto;padding:0 8px;font-size:.82rem;margin-right:6px}
.pg-dots{padding:0 4px}

@media (max-width:760px){
  table.t.cards thead{display:none}
  table.t.cards,table.t.cards tbody,table.t.cards tr,table.t.cards td{display:block;width:100%}
  table.t.cards tr{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:4px 12px}
  table.t.cards td{border:0;padding:0;text-align:left!important}
  table.t.cards td[data-l]::before{content:attr(data-l);display:block;font-size:.72rem;color:var(--muted);font-weight:600}
  table.t.cards td.full{grid-column:1/-1}
  table.t.cards td.hide-m{display:none}
  table.t.cards td.row-acts-cell{grid-column:1/-1;margin-top:6px}
  table.t.cards .row-acts{justify-content:flex-start}
}

/* ---------- Products grid ---------- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column}
.pcard .ph{aspect-ratio:4/3;background:var(--surface-2);display:grid;place-items:center;cursor:zoom-in;border:0;padding:0;width:100%;position:relative}
.pcard .ph img,.pcard .ph svg{width:100%;height:100%;object-fit:cover}
.pcard .ph .sku{position:absolute;left:10px;top:10px;background:color-mix(in srgb,var(--surface) 88%,transparent);font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px}
.pcard .bd{padding:12px 14px;display:grid;gap:8px;flex:1}
.pcard .bd b{font-size:.98rem;line-height:1.25}
.pcard .meta{display:flex;justify-content:space-between;align-items:center;gap:6px 8px;flex-wrap:wrap}
.pcard .price{font-family:var(--display);font-weight:700;font-size:1.1rem}
.pcard .ft{display:flex;gap:6px;padding:0 14px 14px}
.pcard .ft .btn{flex:1}

/* ---------- Document editor ---------- */
.doc{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.doc .sum{position:sticky;top:80px;display:grid;gap:14px}
.lines{display:grid;gap:0}
.line{display:grid;grid-template-columns:44px minmax(0,1fr) 110px 130px 120px 36px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.line .nm b{display:block;font-weight:600;line-height:1.25}
.line .nm small{color:var(--muted);font-size:.78rem}
.line .input{height:38px;text-align:right;font-variant-numeric:tabular-nums}
.line .tot{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.lf{display:block;min-width:0}.lf>span{display:none;font-size:.72rem;color:var(--muted);font-weight:600;margin-bottom:3px}
.line-wrap{border-top:1px solid var(--line)}.line-wrap:first-child{border-top:0}.line-wrap .line{border-top:0}
.lote-row{display:grid;grid-template-columns:1fr 180px;gap:10px;padding:0 46px 12px 54px}
.lote-row .input{height:36px}
.uvsel{height:28px!important;width:auto!important;padding:0 6px!important;font-size:.78rem;text-align:left!important;margin-top:2px}
.line .warn-stock{color:var(--chili);font-weight:600}
.lines-head{display:grid;grid-template-columns:44px minmax(0,1fr) 110px 130px 120px 36px;gap:10px;font-size:.76rem;color:var(--muted);font-weight:600;padding-bottom:6px}
.lines-head span:nth-child(n+3){text-align:right}
.addline{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;margin-top:10px;border:1.5px dashed var(--line-2);border-radius:var(--r);background:none;cursor:pointer;color:var(--brand);font-weight:700}
.addline:hover{background:var(--brand-soft);border-color:var(--brand)}
.totals{display:grid;gap:8px}
.totals div{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.totals .grand{border-top:1px solid var(--line);padding-top:12px;margin-top:4px;font-family:var(--display);font-size:1.5rem;font-weight:800;align-items:baseline}
.totals .grand small{font-family:var(--font);font-size:.82rem;color:var(--muted);font-weight:600}
@media (max-width:760px){
  .lines-head{display:none}
  .line{grid-template-columns:44px 1fr 1fr 36px;grid-template-areas:"img nm nm del" "q q p p" "t t t t";row-gap:8px;padding-top:14px}
  .line .thumb{grid-area:img}.line .nm{grid-area:nm}.line .del{grid-area:del}
  .line .q{grid-area:q}.line .p{grid-area:p}.line .tot{grid-area:t}
  .lf>span{display:block!important}
  .lote-row{padding:0 0 12px;grid-template-columns:1fr 1fr}
}

/* ---------- Picker ---------- */
.picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pick{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0;cursor:pointer;text-align:left;overflow:hidden;display:flex;flex-direction:column;position:relative}
.pick:hover{border-color:var(--brand)}
.pick .ph{aspect-ratio:16/10;background:var(--surface-2);overflow:hidden}
.pick .ph img,.pick .ph svg{width:100%;height:100%;object-fit:cover;display:block}
.pick .bd{padding:8px 10px;display:grid;gap:4px}
.pick b{font-size:.86rem;line-height:1.2}
.pick small{font-size:.76rem;color:var(--muted)}
.pick[disabled]{opacity:.45;cursor:not-allowed}
.pick .qty{position:absolute;top:6px;right:6px;background:var(--chili);color:#fff;border-radius:99px;font-size:.75rem;font-weight:800;min-width:24px;height:24px;display:grid;place-items:center;padding:0 6px}

/* ---------- Kanban ---------- */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory}
.kcol{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px;min-height:300px;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px}
.kcol.over{border-color:var(--brand);background:var(--brand-soft)}
.kcol header{display:flex;align-items:center;gap:8px;padding:4px 6px 6px;font-weight:700;font-size:.9rem}
.kcol header i{width:10px;height:10px;border-radius:50%}
.kcol header span{margin-left:auto;color:var(--muted);font-weight:600;font-size:.8rem}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:grab;display:grid;gap:6px;box-shadow:var(--shadow)}
.kcard:active{cursor:grabbing}
.kcard.dragging{opacity:.4}
.kcard .h{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--muted);font-weight:600}
.kcard b{font-size:.94rem;line-height:1.25}
.kcard .f{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.8rem}
.kcard .late{color:var(--chili);font-weight:700}
.prio{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}

/* ---------- Modal / sheet ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(6,16,10,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s ease}
.modal{background:var(--surface);border-radius:20px;width:min(640px,100%);max-height:min(88vh,900px);display:flex;flex-direction:column;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);animation:pop .18s ease}
.modal.wide{width:min(980px,100%)}
.modal.narrow{width:min(440px,100%)}
.modal>header{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.modal>header h2{flex:1}
.modal>.bd{padding:20px;overflow-y:auto;flex:1}
.modal>footer{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
@keyframes up{from{transform:translateY(100%)}}
@media (max-width:760px){
  .modal-bg{align-items:flex-end;padding:0}
  .modal,.modal.wide,.modal.narrow{width:100%;max-height:92vh;border-radius:20px 20px 0 0;animation:up .22s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
  .modal>header::before{content:"";position:absolute;left:50%;top:6px;width:40px;height:4px;border-radius:9px;background:var(--line-2);transform:translateX(-50%)}
  .modal>header{position:relative;padding-top:22px}
}
.lightbox{position:fixed;inset:0;z-index:200;background:rgba(5,10,7,.94);display:flex;align-items:center;justify-content:center;touch-action:none;animation:fade .15s}
.lightbox img,.lightbox svg.big{max-width:92vw;max-height:84vh;border-radius:12px;transition:transform .05s;transform-origin:center;user-select:none;-webkit-user-drag:none}
.lightbox .cap{position:absolute;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));text-align:center;color:#E8EFEA}
.lightbox .cap small{display:block;color:#9FB4A6}
.lightbox .x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;background:rgba(255,255,255,.12);border:0;color:#fff;width:44px;height:44px;border-radius:50%;cursor:pointer;font-size:1.3rem}
.lightbox .zoom{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px;display:flex;gap:6px}
.lightbox .zoom button{background:rgba(255,255,255,.12);border:0;color:#fff;width:44px;height:44px;border-radius:50%;cursor:pointer;font-size:1.2rem}

/* ---------- Palette & toast ---------- */
.palette{position:fixed;inset:0;z-index:150;background:rgba(6,16,10,.45);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px;animation:fade .12s}
.palette .box{width:min(620px,100%);background:var(--surface);border-radius:16px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);overflow:hidden;border:1px solid var(--line)}
.palette input{width:100%;border:0;border-bottom:1px solid var(--line);padding:18px 20px;font-size:1.05rem;background:transparent;outline:none}
.palette ul{list-style:none;margin:0;padding:6px;max-height:52vh;overflow-y:auto}
.palette li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer}
.palette li svg{width:18px;height:18px;color:var(--muted)}
.palette li small{margin-left:auto;color:var(--muted);font-size:.78rem}
.palette li.sel{background:var(--brand-soft)}
.palette .sec{font-size:.74rem;color:var(--muted);font-weight:700;padding:8px 12px 4px}
.toasts{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:300;display:grid;gap:8px}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);font-weight:500;display:flex;gap:10px;align-items:center;animation:pop .2s;max-width:380px}
.toast.err{background:var(--chili);color:#fff}
.toast.warn{background:var(--sun);color:#1b1404;flex-wrap:wrap}
.toast .t-acts{display:flex;gap:6px;width:100%;justify-content:flex-end}
.toast .t-acts a{color:inherit;font-weight:700;padding:4px 10px;border-radius:8px;background:rgba(0,0,0,.12);text-decoration:none}
.toast svg{width:18px;height:18px;flex:none}

/* ---------- Misc ---------- */
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:.9rem}
.dl dt{color:var(--muted)} .dl dd{margin:0;font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--chili)}
.note{padding:12px 14px;border-radius:12px;background:var(--sun-soft);color:var(--ink-2);font-size:.88rem;display:flex;gap:10px}
.note.ok{background:var(--brand-soft)}
.note svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--sun)}
.note.ok svg{color:var(--brand)}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer}
.switch input{width:40px;height:22px;appearance:none;background:var(--line-2);border-radius:99px;position:relative;cursor:pointer;transition:background .15s;margin:0;flex:none}
.switch input::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .15s}
.switch input:checked{background:var(--brand)}
.switch input:checked::after{left:20px}
.perm-grid td:not(:first-child){text-align:center}
.uploader{display:flex;gap:14px;align-items:center}
.uploader .prev{width:96px;height:96px;border-radius:14px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.uploader .prev img,.uploader .prev svg{width:100%;height:100%;object-fit:cover}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent;display:block}
.swatches input{display:none}
.swatches input:checked+label{border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--surface)}
.stage-steps{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- Responsive shell ---------- */
@media (max-width:1180px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.dash{grid-template-columns:1fr}.doc{grid-template-columns:1fr}.doc .sum{position:static}}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);transform:translateX(-100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:auto}
  .app.menu .side{transform:none;box-shadow:20px 0 60px rgba(0,0,0,.35)}
  .app.menu .scrim{display:block;position:fixed;inset:0;background:rgba(6,16,10,.45);z-index:25}
  .search-btn{min-width:0;width:38px;height:38px;padding:0;justify-content:center}
  .search-btn span,.search-btn kbd{display:none}
  .sync span{display:none}
  .bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px env(safe-area-inset-bottom,0px)}
  .bottom a,.bottom button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 8px;font-size:.7rem;font-weight:600;color:var(--muted);text-decoration:none;background:none;border:0;cursor:pointer}
  .bottom a.on{color:var(--brand)}
  .bottom svg{width:22px;height:22px}
  .bottom .fab{position:relative}
  .bottom .fab span{width:54px;height:54px;border-radius:18px;background:var(--chili);color:#fff;display:grid;place-items:center;margin-top:-22px;box-shadow:0 10px 24px -8px color-mix(in srgb,var(--chili) 70%,transparent);border:3px solid var(--bg)}
  .bottom .fab span svg{width:26px;height:26px}
  .toasts{left:16px;right:16px;bottom:calc(86px + env(safe-area-inset-bottom,0px))}
  .toast{max-width:none}
}
@media (min-width:981px){.menu-btn{display:none}}
@media (max-width:760px){
  .kpis{gap:10px}
  .kpi{padding:14px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .span2{grid-column:auto}
  .g4.keep2,.g3.keep2{grid-template-columns:1fr 1fr}
  .kpis{grid-template-columns:1fr 1fr}.kpi.feature{grid-column:1/-1}
  .kpi .val{font-size:1.12rem;white-space:normal;overflow-wrap:anywhere}
  .kpi.feature .val{font-size:1.6rem}
  .pgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .pcard .bd{padding:10px}
  .pcard .ft{padding:0 10px 10px}
  .kanban{grid-template-columns:repeat(5,86vw)}
  .top .crumb{font-size:.95rem}
}

/* ---------- Print ---------- */
#print{display:none}
@media print{
  @page{margin:14mm}
  body{background:#fff;color:#111}
  #root,.toasts,.modal-bg,.palette,.lightbox{display:none!important}
  #print{display:block;font:11pt/1.45 var(--font);color:#111}
  #print table{width:100%;border-collapse:collapse;margin:14px 0}
  #print th{text-align:left;border-bottom:2px solid #111;padding:6px 4px;font-size:9pt}
  #print td{border-bottom:1px solid #ccc;padding:6px 4px}
  #print .r{text-align:right}
  #print .ph{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:3px solid #D4271F;padding-bottom:12px}
  #print .ph img{max-height:60px;max-width:160px}
  #print h1{font-size:20pt;margin:0}
  #print .meta{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
  #print .tot{margin-left:auto;width:260px}
  #print .tot div{display:flex;justify-content:space-between;padding:3px 0}
  #print .tot .g{font-weight:800;font-size:13pt;border-top:2px solid #111;padding-top:6px}
  #print .foot{margin-top:30px;font-size:9pt;color:#555;display:flex;justify-content:space-between;gap:30px}
  #print .sig{border-top:1px solid #111;padding-top:4px;width:200px;text-align:center}
}
</style>

<script>
"use strict";
/* =========================================================
   CONFIGURACIÓN DE LA NUBE (Supabase)
   Para producción en Vercel: pega aquí la URL y la anon key
   de tu proyecto. Si se dejan vacías, el sistema trabaja en
   modo local (datos en este navegador) con datos de ejemplo.
   También se pueden configurar desde Configuración → Nube.
   ========================================================= */
const SUPABASE_URL = "";
const SUPABASE_ANON_KEY = "";

/* ---------------- Utilidades ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const LS = "kpl-";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const r2 = n => Math.round((+n || 0) * 100) / 100;
const iso = d => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 6e4); return z.toISOString().slice(0, 10); };
const today = () => iso(new Date());
const addDays = (s, n) => { const d = new Date(s + "T12:00"); d.setDate(d.getDate() + n); return iso(d); };
const ym = s => (s || "").slice(0, 7);
const fmtCache = {};
function money(n, cur = "DOP") {
  const k = cur;
  fmtCache[k] ||= new Intl.NumberFormat(cur === "USD" ? "en-US" : "es-DO", { style: "currency", currency: cur, minimumFractionDigits: 2 });
  return fmtCache[k].format(+n || 0);
}
const short = n => { n = +n || 0; const a = Math.abs(n); return a >= 1e6 ? (n / 1e6).toFixed(1).replace(".0", "") + " M" : a >= 1e3 ? (n / 1e3).toFixed(a >= 1e4 ? 0 : 1).replace(".0", "") + " k" : Math.round(n) + ""; };
const qty = n => new Intl.NumberFormat("es-DO", { maximumFractionDigits: 2 }).format(+n || 0);
const fdate = s => s ? new Date(s + "T12:00").toLocaleDateString("es-DO", { day: "2-digit", month: "short", year: "numeric" }) : "—";
const MESES = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
const mesLargo = m => new Date(m + "-15T12:00").toLocaleDateString("es-DO", { month: "long", year: "numeric" });
const ic = (id, cls = "") => `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
const initials = n => (n || "?").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();
const debounce = (fn, ms = 200) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const norm = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
function lsGet(k, d = null) { try { const v = localStorage.getItem(LS + k); return v == null ? d : JSON.parse(v); } catch { return d; } }
function lsSet(k, v) { try { localStorage.setItem(LS + k, JSON.stringify(v)); return true; } catch { return false; } }
async function sha(s) {
  try { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
  catch { return "plain:" + s; }
}

/* Ilustración del producto cuando no hay foto */
function art(p, big) {
  const c = p?.color || "#D4271F", shape = p?.forma || "aji";
  const stem = `<path d="M100 44c0-12 6-20 18-24" stroke="#2F7A3E" stroke-width="7" fill="none" stroke-linecap="round"/>`;
  const shapes = {
    aji: `<path d="M84 50c-18 16-22 52-2 76 18 21 58 16 70 2 8-9 2-18-10-23-16-7-24-17-28-34-3-12-4-22-14-25-7-2-11 0-16 4z" fill="${c}"/>${stem}<path d="M80 52c8-8 24-8 30 2" stroke="#2F7A3E" stroke-width="10" fill="none" stroke-linecap="round"/><ellipse cx="94" cy="80" rx="6" ry="17" fill="#fff" opacity=".3" transform="rotate(-24 94 80)"/>`,
    morron: `<path d="M64 62c-10 10-12 40-2 58 9 15 22 16 38 16s29-1 38-16c10-18 8-48-2-58-10-9-22-8-36-8s-26-1-36 8z" fill="${c}"/><path d="M100 56v74" stroke="#000" stroke-opacity=".12" stroke-width="5"/>${stem}<path d="M84 58c6-8 26-8 32 0" stroke="#2F7A3E" stroke-width="10" fill="none" stroke-linecap="round"/><ellipse cx="78" cy="86" rx="7" ry="18" fill="#fff" opacity=".28"/>`,
    bote: `<rect x="72" y="36" width="56" height="14" rx="4" fill="#2C2C2C"/><path d="M68 54h64v76a10 10 0 0 1-10 10H78a10 10 0 0 1-10-10z" fill="${c}"/><rect x="74" y="80" width="52" height="34" rx="4" fill="#F4F1E8"/><path d="M90 104c2-10 10-16 20-14-2 10-10 16-20 14z" fill="${c}"/>`,
    caja: `<path d="M50 62l50-22 50 22v54l-50 22-50-22z" fill="${c}"/><path d="M50 62l50 22 50-22M100 84v54" stroke="#000" stroke-opacity=".2" stroke-width="3" fill="none"/><path d="M74 51l50 22" stroke="#fff" stroke-opacity=".35" stroke-width="6"/>`
  };
  return `<svg ${big ? 'class="big" ' : ""}viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(p?.nombre || "Producto")}"><rect width="200" height="150" style="fill:${big ? "#F4F1E8" : "var(--surface-2)"}"/><rect width="200" height="150" fill="${c}" opacity=".1"/>${shapes[shape] || shapes.aji}</svg>`;
}
const photo = (p, big) => p?.foto ? `<img src="${p.foto}" alt="${esc(p.nombre)}" loading="lazy">` : art(p, big);

/* ---------------- Almacenamiento ---------------- */
const COLS = ["productos", "clientes", "proveedores", "compras", "ventas", "cotizaciones", "ordenes", "gastos", "presupuestos", "ajustes", "usuarios", "roles", "notas", "lotes", "listas", "cajas", "bitacora", "ncf"];

/* ---------------- Nube (Supabase) ---------------- */
const cloud = {
  sb: null, on: false, channel: null,
  cfg() {
    const s = lsGet("sb");
    if (s && s.url && s.key) return s;
    return SUPABASE_URL && SUPABASE_ANON_KEY ? { url: SUPABASE_URL, key: SUPABASE_ANON_KEY } : null;
  },
  async init() {
    const c = this.cfg(); if (!c) return false;
    try {
      await new Promise((res, rej) => { if (window.supabase) return res(); const s = $("script[data-sb]"); s.addEventListener("load", res); s.addEventListener("error", rej); setTimeout(() => window.supabase ? res() : rej(new Error("timeout")), 8000); });
      this.sb = window.supabase.createClient(c.url, c.key);
      this.on = true; return true;
    } catch (e) { console.warn(e); this.on = false; toast("No se pudo conectar con la nube. Trabajando en modo local.", "err"); return false; }
  },
  async pull() {
    const d = {}; COLS.forEach(c => d[c] = []); let cfg = null, from = 0;
    for (;;) {
      const { data, error } = await this.sb.from("registros").select("coleccion,id,data").range(from, from + 999);
      if (error) throw error;
      data.forEach(r => { if (r.coleccion === "config") cfg = r.data; else (d[r.coleccion] ||= []).push(r.data); });
      if (data.length < 1000) break; from += 1000;
    }
    store.data = d; store.config = { ...defaultConfig(), ...(cfg || {}) }; delete store.config.id; store.save();
  },
  upsert(c, o) {
    if (!this.on || !S.user) return;
    this.sb.from("registros").upsert({ coleccion: c, id: o.id, data: o, updated_at: new Date().toISOString() })
      .then(({ error }) => { if (error) toast("No se sincronizó con la nube: " + error.message, "err"); });
  },
  remove(c, id) {
    if (!this.on || !S.user) return;
    this.sb.from("registros").delete().match({ coleccion: c, id }).then(({ error }) => { if (error) toast("No se eliminó en la nube: " + error.message, "err"); });
  },
  listen() {
    if (!this.on || this.channel) return;
    const rerender = debounce(() => { store.save(); if (!$(".modal-bg") && !["venta-nueva", "compra-nueva", "cotizacion-nueva"].includes(S.view)) render(); }, 400);
    this.channel = this.sb.channel("registros-live").on("postgres_changes", { event: "*", schema: "public", table: "registros" }, p => {
      if (p.eventType === "DELETE") { const o = p.old || {}; if (o.coleccion && store.data[o.coleccion]) store.data[o.coleccion] = store.data[o.coleccion].filter(x => x.id !== o.id); }
      else { const r = p.new; if (r.coleccion === "config") { store.config = { ...defaultConfig(), ...r.data }; delete store.config.id; } else { const a = store.data[r.coleccion] ||= []; const i = a.findIndex(x => x.id === r.id); i >= 0 ? a[i] = r.data : a.push(r.data); } }
      rerender();
    }).subscribe();
  },
  async pushAll() {
    const rows = [{ coleccion: "config", id: "main", data: { id: "main", ...store.config } }];
    COLS.forEach(c => store.all(c).forEach(o => rows.push({ coleccion: c, id: o.id, data: o })));
    for (let i = 0; i < rows.length; i += 500) { const { error } = await this.sb.from("registros").upsert(rows.slice(i, i + 500)); if (error) throw error; }
    return rows.length;
  }
};

/* Existencias: en la nube se mueven con una función atómica de Postgres para que dos ventas simultáneas no se pisen */
async function moverStock(items, { negativo = false } = {}) {
  const m = {}; items.forEach(i => { if (!i.delta) return; m[i.id] ||= { id: i.id, delta: 0 }; m[i.id].delta = r2(m[i.id].delta + i.delta); if (i.costo != null) m[i.id].costo = i.costo; });
  const list = Object.values(m).filter(i => i.delta); if (!list.length) return;
  const before = Object.fromEntries(list.map(i => [i.id, producto(i.id)?.stock ?? 0]));
  let done = false;
  if (cloud.on) {
    const { data, error } = await cloud.sb.rpc("mover_stock", { items: list, permitir_negativo: negativo });
    if (!error) { data.forEach(r => { const p = producto(r.id); if (p) { p.stock = +r.stock; p.costo = +r.costo; } }); store.save(); done = true; }
    else { const x = /STOCK_INSUFICIENTE:([^:]*):([-\d.]+)/.exec(error.message || ""); if (x) throw new Error(`No hay suficiente ${x[1]}: quedan ${qty(+x[2])}.`); if (!/mover_stock|PGRST202|42883/.test((error.message || "") + error.code)) throw new Error(error.message); console.warn("mover_stock no instalado; se usa el modo simple"); }
  }
  if (!done) {
    for (const i of list) { const p = producto(i.id); if (!p) throw new Error("Un producto ya no existe en el catálogo."); if (!negativo && p.stock + i.delta < -1e-9) throw new Error(`No hay suficiente ${p.nombre}: quedan ${qty(p.stock)}.`); }
    list.forEach(i => { const p = producto(i.id); const st = Math.max(0, p.stock); if (i.costo != null && i.delta > 0) p.costo = r2((st * p.costo + i.delta * i.costo) / (st + i.delta || 1)); p.stock = r2(p.stock + i.delta); store.put("productos", p, true); });
    store.save();
  }
  const cruzaron = list.map(i => producto(i.id)).filter(p => p && p.stock <= p.minimo && before[p.id] > p.minimo);
  if (cruzaron.length) alertaStock(cruzaron);
}

const NCF_TIPOS = { B01: "Crédito fiscal", B02: "Consumo", B14: "Regímenes especiales", B15: "Gubernamental", B16: "Exportaciones", B04: "Nota de crédito", E31: "e-CF Crédito fiscal", E32: "e-CF Consumo", E44: "e-CF Regímenes especiales", E45: "e-CF Gubernamental", E46: "e-CF Exportaciones", E34: "e-CF Nota de crédito" };
const toE = t => store.config.ncfModo === "E" ? ({ B01: "E31", B02: "E32", B14: "E44", B15: "E45", B16: "E46", B04: "E34" }[t] || t) : t;
const fmtNCF = (tipo, n) => tipo + String(n).padStart(tipo.startsWith("E") ? 10 : 8, "0");
const ncfDefault = (c, tipoVenta) => toE(c?.tipoNCF || (tipoVenta === "Exportación" ? "B16" : c?.rnc && c.tipo !== "Exportación" ? "B01" : "B02"));
const seqFor = tipo => store.all("ncf").filter(s => s.activo !== false && s.tipo === tipo && s.actual <= s.hasta && (!s.vence || s.vence >= today())).sort((a, b) => a.actual - b.actual)[0];
const seqRest = s => Math.max(0, s.hasta - s.actual + 1);
function ncfAlertas() {
  if (!feat("ncf")) return [];
  const out = []; const tipos = [...new Set(store.all("ncf").filter(s => s.activo !== false).map(s => s.tipo))];
  tipos.forEach(t => { const s = seqFor(t); if (!s) out.push(`No hay secuencia vigente de ${t} (${NCF_TIPOS[t] || t}).`); else { const r = seqRest(s); if (r <= Math.max(10, (s.hasta - s.desde + 1) * .1)) out.push(`Quedan ${r} comprobantes ${t}.`); if (s.vence && s.vence <= addDays(today(), 30)) out.push(`La secuencia ${t} vence el ${fdate(s.vence)}.`); } });
  return out;
}
async function tomarNCF(tipo) {
  if (!feat("ncf") || !tipo) return { ncf: "", vence: "" };
  const s = seqFor(tipo); if (!s) throw new Error(`No hay secuencia NCF ${tipo} vigente. Agrégala en Configuración → Comprobantes.`);
  if (cloud.on) {
    const { data, error } = await cloud.sb.rpc("tomar_ncf", { seq_id: s.id });
    if (!error) { s.actual = +data + 1; store.save(); return { ncf: fmtNCF(tipo, +data), vence: s.vence || "" }; }
    if (!/tomar_ncf|PGRST202|42883/.test((error.message || "") + error.code)) throw new Error(error.message);
  }

}

function pager(name, sizes = [10, 25, 50]) {
  const st = { page: 1, size: lsGet("pg-" + name, sizes[0]) }; if (!sizes.includes(st.size)) st.size = sizes[0];
  return {
    st, reset() { st.page = 1; },
    slice(list) { const pages = Math.max(1, Math.ceil(list.length / st.size)); st.page = Math.min(Math.max(1, st.page), pages); return list.slice((st.page - 1) * st.size, st.page * st.size); },
    html(total) {
      if (!total) return "";
      const pages = Math.max(1, Math.ceil(total / st.size)), p = st.page, a = (p - 1) * st.size + 1, b = Math.min(total, p * st.size);
      const nums = []; for (let i = 1; i <= pages; i++) if (i === 1 || i === pages || Math.abs(i - p) <= 1) nums.push(i); else if (nums[nums.length - 1] !== "…") nums.push("…");
      const btn = (to, label, dis, on, aria) => `<button class="btn sm ${on ? "pri" : "ghost"} pg-b" data-pg="${name}" data-to="${to}" ${dis ? "disabled" : ""} ${on ? 'aria-current="page"' : ""} aria-label="${aria || "Página " + label}">${label}</button>`;
      return `<nav class="pager" aria-label="Paginación"><span>Mostrando <b>${a}–${b}</b> de <b>${total}</b></span>
        <span class="pg-ctl"><select class="input pg-size" data-pgsize="${name}" aria-label="Filas por página">${sizes.map(z => `<option value="${z}" ${z === st.size ? "selected" : ""}>${z} por página</option>`).join("")}</select>
        ${btn(p - 1, "‹", p <= 1, false, "Página anterior")}${nums.map(n => n === "…" ? `<span class="pg-dots">…</span>` : btn(n, n, false, n === p)).join("")}${btn(p + 1, "›", p >= pages, false, "Página siguiente")}</span></nav>`;
    },
    bind(root, redraw) {
      root.addEventListener("click", e => { const b = e.target.closest(`[data-pg="${name}"]`); if (!b || b.disabled) return; e.stopPropagation(); st.page = +b.dataset.to; redraw(); const r = root.getBoundingClientRect(); if (r.top < 70) window.scrollBy({ top: r.top - 80, behavior: "smooth" }); });
      root.addEventListener("change", e => { const s = e.target.closest(`[data-pgsize="${name}"]`); if (!s) return; st.size = +s.value; st.page = 1; lsSet("pg-" + name, st.size); redraw(); });
    }
  };
}

  const img = lb.querySelector("img, svg.big"); let sc = 1, tx = 0, ty = 0; const pts = new Map(); let startD = 0, startSc = 1, last = null, lastTap = 0;
  const apply = () => { sc = Math.min(5, Math.max(1, sc)); if (sc === 1) { tx = 0; ty = 0; } img.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`; };

    const now = Date.now(); if (pts.size === 1 && now - lastTap < 300) { sc = sc > 1 ? 1 : 2.5; apply(); } lastTap = now;

function palette() {
  if ($(".palette")) return;
  const el = document.createElement("div"); el.className = "palette";
  el.innerHTML = `<div class="box" role="dialog" aria-label="Buscar"><input placeholder="Busca productos, clientes, facturas o escribe una acción…" aria-label="Buscar"><ul></ul></div>`;
  document.body.append(el);
  const inp = el.querySelector("input"), ul = el.querySelector("ul"); let items = [], sel = 0;
  const actions = [["venta-nueva", "Nueva factura", "i-receipt"], ["cotizacion-nueva", "Nueva cotización", "i-quote"], ["compra-nueva", "Nueva compra", "i-cart"]].filter(([v]) => can(v));
  const views = NAV.flatMap(g => g.items).filter(([v]) => can(v) && viewOn(v));
  const close = () => el.remove();
  const draw = () => {
    const q = norm(inp.value.trim()); items = [];
    const A = (sec, label, icon, hint, run) => items.push({ sec, label, icon, hint, run });
    actions.filter(a => !q || norm(a[1]).includes(q)).forEach(a => A("Acciones", a[1], a[2], "", () => go(a[0])));
    views.filter(a => !q || norm(a[1]).includes(q)).forEach(a => A("Ir a", a[1], a[2], "", () => go(a[0])));
    if (q) {
      store.all("productos").filter(p => norm(p.nombre + " " + p.sku).includes(q)).slice(0, 5).forEach(p => A("Productos", p.nombre, "i-box", "Stock " + qty(p.stock), () => { go("productos"); setTimeout(() => productForm(p), 50); }));
      if (can("clientes")) store.all("clientes").filter(c => norm(c.nombre + " " + c.rnc).includes(q)).slice(0, 4).forEach(c => A("Clientes", c.nombre, "i-users", c.pais || "", () => { go("clientes"); setTimeout(() => partyForm("clientes", c), 50); }));
      if (can("ventas")) store.all("ventas").filter(v => norm("fac " + v.num + " " + cliente(v.clienteId).nombre).includes(q)).slice(-5).reverse().forEach(v => A("Facturas", "Factura #" + v.num + " · " + cliente(v.clienteId).nombre, "i-receipt", money(v.total, v.moneda), () => { go("ventas"); setTimeout(() => ventaDetail(v), 50); }));
      if (can("cotizaciones")) store.all("cotizaciones").filter(v => norm("cot " + v.num + " " + cliente(v.clienteId).nombre).includes(q)).slice(-4).reverse().forEach(v => A("Cotizaciones", "Cotización #" + v.num + " · " + cliente(v.clienteId).nombre, "i-quote", v.estado, () => { go("cotizaciones"); setTimeout(() => cotDetail(v), 50); }));
    }
    sel = Math.min(sel, Math.max(0, items.length - 1)); let last = "";
    ul.innerHTML = items.length ? items.map((it, i) => { const h = it.sec !== last ? `<div class="sec">${it.sec}</div>` : ""; last = it.sec; return h + `<li data-i="${i}" class="${i === sel ? "sel" : ""}">${ic(it.icon)}<span>${esc(it.label)}</span><small>${esc(it.hint)}</small></li>`; }).join("") : `<div class="empty"><b>Sin resultados</b>Prueba con otro nombre, SKU o número.</div>`;
    ul.querySelector(".sel")?.scrollIntoView({ block: "nearest" });
  };
  inp.addEventListener("input", () => { sel = 0; draw(); });
  inp.addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { sel = Math.min(items.length - 1, sel + 1); draw(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { sel = Math.max(0, sel - 1); draw(); e.preventDefault(); }
    else if (e.key === "Enter" && items[sel]) { close(); items[sel].run(); }
    else if (e.key === "Escape") close();
  });
  ul.addEventListener("click", e => { const li = e.target.closest("li"); if (li) { close(); items[+li.dataset.i].run(); } });
  el.addEventListener("mousedown", e => { if (e.target === el) close(); });
  draw(); inp.focus();
}

/* ---------------- Gráficos (SVG sin librerías) ---------------- */
function lineChart(labels, series, { h = 250, money: isMoney = true } = {}) {
  const W = 720, H = h, pl = 54, pr = 14, pt = 14, pb = 30, iw = W - pl - pr, ih = H - pt - pb;
  const max = Math.max(1, ...series.flatMap(s => s.values)); const mag = Math.pow(10, Math.floor(Math.log10(max))); const top = Math.ceil(max / mag * 1.1) * mag;
  const x = i => pl + (labels.length === 1 ? iw / 2 : i * iw / (labels.length - 1)); const y = v => pt + ih - v / top * ih;
  const path = vals => { const p = vals.map((v, i) => [x(i), y(v)]); let d = `M${p[0][0]},${p[0][1]}`; for (let i = 0; i < p.length - 1; i++) { const p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2; d += ` C${p1[0] + (p2[0] - p0[0]) / 6},${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6},${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]},${p2[1]}`; } return d; };
  const ticks = [0, .25, .5, .75, 1].map(f => top * f);
  const gid = "g" + uid();
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${series[0].color}" stop-opacity=".28"/><stop offset="1" stop-color="${series[0].color}" stop-opacity="0"/></linearGradient></defs>`;
  ticks.forEach(t => svg += `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}" style="stroke:var(--line)" stroke-dasharray="${t ? "3 4" : ""}"/><text x="${pl - 8}" y="${y(t) + 4}" text-anchor="end" font-size="11" style="fill:var(--muted)">${isMoney ? short(t) : qty(t)}</text>`);
  labels.forEach((l, i) => svg += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="11" style="fill:var(--muted)">${esc(l)}</text>`);
  svg += `<path d="${path(series[0].values)} L${x(labels.length - 1)},${y(0)} L${x(0)},${y(0)} Z" fill="url(#${gid})"/>`;
  series.forEach((s, k) => svg += `<path d="${path(s.values)}" fill="none" stroke="${s.color}" stroke-width="${k ? 2 : 3}" stroke-linecap="round" ${s.dash ? 'stroke-dasharray="6 6"' : ""}/>`);
  svg += `<line class="cur" y1="${pt}" y2="${pt + ih}" style="stroke:var(--line-2)" opacity="0"/>`;
  series.forEach((s, k) => svg += `<circle class="dot" data-k="${k}" r="5" fill="${s.color}" style="stroke:var(--surface)" stroke-width="2" opacity="0"/>`);
  svg += `<rect class="hit" x="${pl}" y="${pt}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;
  const id = "c" + uid();
  setTimeout(() => {
    const el = document.getElementById(id); if (!el) return; const s = el.querySelector("svg"), tip = el.querySelector(".tip");
    const move = e => {
      const r = s.getBoundingClientRect(); const px = (e.clientX - r.left) / r.width * W; const i = Math.max(0, Math.min(labels.length - 1, Math.round((px - pl) / (iw / Math.max(1, labels.length - 1)))));
      s.querySelector(".cur").setAttribute("x1", x(i)); s.querySelector(".cur").setAttribute("x2", x(i)); s.querySelector(".cur").setAttribute("opacity", 1);
      s.querySelectorAll(".dot").forEach(d => { const k = +d.dataset.k; d.setAttribute("cx", x(i)); d.setAttribute("cy", y(series[k].values[i])); d.setAttribute("opacity", 1); });
      tip.innerHTML = `<b>${esc(labels[i])}</b><br>` + series.map(sr => `${esc(sr.name)}: ${isMoney ? money(sr.values[i]) : qty(sr.values[i])}`).join("<br>");
      tip.style.left = (x(i) / W * r.width) + "px"; tip.style.top = (Math.min(...series.map(sr => y(sr.values[i]))) / H * r.height) + "px"; tip.style.opacity = 1;
    };
    const leave = () => { tip.style.opacity = 0; s.querySelector(".cur").setAttribute("opacity", 0); s.querySelectorAll(".dot").forEach(d => d.setAttribute("opacity", 0)); };
    s.addEventListener("pointermove", move); s.addEventListener("pointerleave", leave);
  });
  return `<div class="chart" id="${id}" style="position:relative">${svg}<div class="tip"></div></div>`;
}
function bars(rows, { fmt = v => money(v), color = "var(--brand)" } = {}) {
  if (!rows.length) return `<div class="empty small">Sin datos en este período.</div>`;
  const max = Math.max(...rows.map(r => r.value), 1);
  return `<div class="bars">${rows.map(r => `<div class="bar-row"><div class="t"><span>${esc(r.label)}</span><span class="num muted">${fmt(r.value)}</span></div><div class="track"><i style="width:${Math.max(2, r.value / max * 100)}%;background:${r.color || color}"></i></div></div>`).join("")}</div>`;
}
function monthsBack(n) { const out = []; const d = new Date(); d.setDate(15); for (let i = n - 1; i >= 0; i--) { const x = new Date(d.getFullYear(), d.getMonth() - i, 15); out.push(iso(x).slice(0, 7)); } return out; }

async function saveDoc(kind, d, { editing, fromCot }) {

  if (!d[K.key]) { toast(kind === "compra" ? "Elige el proveedor." : "Elige el cliente.", "err"); $("[name=party]")?.focus(); return; }

  if (!d.lineas.length) return toast("Agrega al menos un producto con cantidad mayor que cero.", "err");
  if (d.lineas.some(l => l.precio === "" || +l.precio < 0)) return toast("Revisa los precios: no pueden quedar vacíos.", "err");
  d.lineas.forEach(l => { l.cant = Math.round(+l.cant * 100000) / 100000; l.precio = Math.round(+l.precio * 10000) / 10000; });
  d.subtotal = r2(d.lineas.reduce((a, l) => a + l.cant * l.precio, 0)); d.itbis = r2(d.subtotal * (+d.itbisPct || 0) / 100); d.total = r2(d.subtotal + d.itbis);

      try { const n = await tomarNCF(feat("ncf") ? v.ncfTipo : ""); v.ncf = n.ncf; v.ncfVence = n.vence; }
      catch (x) { await moverStock(v.lineas.map(l => ({ id: l.productoId, delta: l.cant })), { negativo: true }); throw x; }
      if (!feat("ncf")) delete v.ncfTipo;
      v.num = store.next("ventas", 1001);
      v.lineas.forEach(l => { const p = producto(l.productoId); l.costo = p.costo; l.pesoKg = p.pesoKg || 0; l.pesoBrutoKg = p.pesoBrutoKg || 0; l.hs = p.hs || ""; l.lotes = consumirLotes(l.productoId, l.cant); });
      v.abonos = v.condicion === "Contado" ? [{ fecha: v.fecha, monto: v.total, metodo: v.metodo || "Efectivo", usuario: S.user.nombre }] : []; v.pagado = v.condicion === "Contado" ? v.total : 0; v.estado = v.condicion === "Contado" ? "Pagada" : "Pendiente";
      store.put("ventas", v);

    } else if (kind === "compra") {

      delete c.moneda; delete c.tasa; delete c.tipo; delete c.emb; if (c.condicion === "Crédito") delete c.metodo;
      await moverStock(c.lineas.map(l => ({ id: l.productoId, delta: l.cant, costo: l.precio })));
      c.num = store.next("compras", 501);
      if (feat("lotes")) c.lineas.forEach((l, i) => { const lote = store.put("lotes", { codigo: `L${(l.cosecha || c.fecha).replace(/-/g, "").slice(2)}-${c.num}-${i + 1}`, productoId: l.productoId, finca: l.finca || proveedor(c.proveedorId).nombre, cosecha: l.cosecha || c.fecha, fecha: c.fecha, compraId: c.id || "", compraNum: c.num, proveedorId: c.proveedorId, cantidad: l.cant, disponible: l.cant }, true); l.loteId = lote.id; l.lote = lote.codigo; });

function notaForm(v) {

    <label class="field" data-met><span>Si hay reembolso, ¿cómo se devuelve?</span><select class="input" name="metodo">${["Efectivo", "Transferencia", "Tarjeta", "Cheque"].map(x => `<option>${x}</option>`).join("")}</select></label>
    <label class="field"><span>Fecha</span><input class="input" type="date" name="fecha" value="${today()}"></label></div>
    <div class="totals" style="max-width:340px;margin-left:auto" data-tot></div></form>`, foot: `<button class="btn" data-close>Cancelar</button><button class="btn hot" data-save>Emitir nota de crédito</button>` });
  let reingresa = true; const F = m.$("[data-f]");
  const calc = () => { const lin = v.lineas.map((l, i) => ({ l, q: Math.min(disp(l), Math.max(0, +F.querySelector(`[data-dv="${i}"]`).value || 0)) })); const sub = r2(lin.reduce((a, x) => a + x.q * x.l.precio, 0)); const itb = r2(sub * (+v.itbisPct || 0) / 100); const tot = r2(sub + itb); const aSaldo = Math.min(Math.max(0, saldo(v)), tot); const reemb = r2(tot - aSaldo);
    lin.forEach((x, i) => F.querySelector(`[data-imp="${i}"]`).textContent = money(x.q * x.l.precio, v.moneda));
    m.$("[data-tot]").innerHTML = `<div><span class="muted">Subtotal</span><span>${money(sub, v.moneda)}</span></div><div><span class="muted">ITBIS</span><span>${money(itb, v.moneda)}</span></div><div class="grand"><span>Total</span><span>${money(tot, v.moneda)}</span></div><div class="small muted"><span>Rebaja del saldo</span><span>${money(aSaldo, v.moneda)}</span></div><div class="small ${reemb ? "down" : "muted"}"><span>Reembolso al cliente</span><span>${money(reemb, v.moneda)}</span></div>`;
    m.$("[data-met]").style.display = reemb > 0 ? "" : "none"; return { lin, sub, itb, tot, aSaldo, reemb }; };
  F.addEventListener("input", calc); calc();
  m.$("[data-dest]").onclick = e => { const b = e.target.closest("button"); if (!b) return; reingresa = b.dataset.v === "1"; $$("[data-dest] button", m.el).forEach(x => x.classList.toggle("on", x === b)); };

/* ---------------- Estado de cuenta ---------------- */
function estadoCuenta(cl) {
  const mon = cl.tipo === "Exportación" ? "USD" : "DOP";
  const conv = (amt, doc) => { const dm = doc.moneda || "DOP"; if (dm === mon) return amt; const t = doc.tasa || store.config.tasa; return mon === "USD" ? amt / t : amt * t; };
  const build = (desde, hasta) => {
    const mv = [];
    store.all("ventas").filter(v => v.clienteId === cl.id && v.estado !== "Anulada").forEach(v => { mv.push({ f: v.fecha, n: v.num, doc: "Factura #" + v.num + (v.ncf ? " · " + v.ncf : ""), desc: v.condicion, cargo: conv(v.total, v), abono: 0 }); (v.abonos || []).forEach(a => mv.push({ f: a.fecha, n: v.num + .5, doc: "Pago a factura #" + v.num, desc: a.metodo, cargo: 0, abono: conv(a.monto, v) })); });
    store.all("notas").filter(n => n.clienteId === cl.id && n.estado !== "Anulada").forEach(n => { mv.push({ f: n.fecha, n: n.ventaNum + .7, doc: "Nota de crédito #" + n.num + (n.ncf ? " · " + n.ncf : ""), desc: n.motivo, cargo: 0, abono: conv(n.aplicadoSaldo, n) }); });
    mv.sort((a, b) => a.f.localeCompare(b.f) || a.n - b.n);
    const prev = mv.filter(m => m.f < desde).reduce((a, m) => a + m.cargo - m.abono, 0);
    let s = prev; const rows = mv.filter(m => inRange(m.f, desde, hasta)).map(m => { s += m.cargo - m.abono; return { ...m, saldo: s }; });
    return { prev: r2(prev), rows, saldo: r2(s), cargos: r2(rows.reduce((a, m) => a + m.cargo, 0)), abonos: r2(rows.reduce((a, m) => a + m.abono, 0)) };
  };
  let desde = addDays(today(), -90), hasta = today(), E;
  const toRep = () => ({ tab: "estado", file: "estado-cuenta-" + norm(cl.nombre).replace(/\W+/g, "-"), heading: "Estado de cuenta", title: "Estado de cuenta", sheet: "Estado de cuenta", period: `${cl.nombre}${cl.rnc ? " · " + cl.rnc : ""} · del ${fdate(desde)} al ${fdate(hasta)}`, note: `Montos en ${mon === "USD" ? "dólares" : "pesos"}.`,
    kpis: [["Saldo anterior", money(E.prev, mon)], ["Facturado", money(E.cargos, mon)], ["Pagos y créditos", money(E.abonos, mon)], ["Saldo actual", money(E.saldo, mon)]],
    cols: [{ h: "Fecha" }, { h: "Documento" }, { h: "Detalle" }, { h: "Cargo", r: 1 }, { h: "Abono", r: 1 }, { h: "Saldo", r: 1 }],
    rows: [["", "Saldo anterior", "", "", "", money(E.prev, mon)], ...E.rows.map(m => [fdate(m.f), m.doc, m.desc || "", m.cargo ? money(m.cargo, mon) : "", m.abono ? money(m.abono, mon) : "", money(m.saldo, mon)])],
    xrows: [["", "Saldo anterior", "", "", "", E.prev], ...E.rows.map(m => [m.f, m.doc, m.desc || "", r2(m.cargo) || "", r2(m.abono) || "", r2(m.saldo)])], foot: ["", "Totales", "", money(E.cargos, mon), money(E.abonos, mon), money(E.saldo, mon)] });
  const m = modal({ title: "Estado de cuenta · " + cl.nombre, size: "wide", body: `<div class="grid g3 keep2" style="align-items:end;margin-bottom:12px"><label class="field"><span>Desde</span><input class="input" type="date" data-d value="${desde}"></label><label class="field"><span>Hasta</span><input class="input" type="date" data-h value="${hasta}"></label></div><div data-o></div>`,
    foot: `${cl.telefono ? `<a class="btn" data-wa target="_blank" rel="noopener">${ic("i-wa")}WhatsApp</a>` : ""}<button class="btn" data-x>${ic("i-grid")}Excel</button><button class="btn" data-pdf>${ic("i-quote")}PDF</button><button class="btn pri" data-p>${ic("i-print")}Imprimir</button>` });
  const draw = () => { E = build(desde, hasta); const R = toRep(); m.$("[data-o]").innerHTML = `<div class="kpis">${R.kpis.map((k, i) => `<div class="kpi ${i === 3 ? "feature" : ""}"><span class="lbl">${k[0]}</span><span class="val">${k[1]}</span></div>`).join("")}</div>${reportTableHTML(R, R.rows)}`;
    const wa = m.$("[data-wa]"); if (wa) wa.href = waLink(cl.telefono, `Hola ${cl.contacto || cl.nombre}, le compartimos su estado de cuenta con ${store.config.empresa} al ${fdate(hasta)}: saldo pendiente ${money(E.saldo, mon)}. Quedamos atentos.`); };
  m.$("[data-d]").onchange = e => { desde = e.target.value; draw(); }; m.$("[data-h]").onchange = e => { hasta = e.target.value; draw(); };
  m.$("[data-p]").onclick = () => printReport(toRep()); m.$("[data-pdf]").onclick = () => pdfReport(toRep()); m.$("[data-x]").onclick = () => excelReport(toRep());
  draw();
}

VIEWS.presupuesto = el => {
  let mes = S.presMes || ym(today()); const pg = pager("gastos", [8, 16, 32]);
  const draw = () => {
    S.presMes = mes;
    let pres = store.all("presupuestos").find(p => p.mes === mes);
    const prevP = store.all("presupuestos").filter(p => p.mes < mes).sort((a, b) => b.mes.localeCompare(a.mes))[0];
    const vReal = ventasOK().filter(v => ym(v.fecha) === mes).reduce((a, v) => a + subDOP(v), 0);
    const cReal = comprasOK().filter(c => ym(c.fecha) === mes).reduce((a, c) => a + c.subtotal, 0);
    const gastos = store.all("gastos").filter(g => ym(g.fecha) === mes).sort((a, b) => b.fecha.localeCompare(a.fecha));
    const real = cat => cat === "Compras de mercancía" ? cReal : gastos.filter(g => g.categoria === cat).reduce((a, g) => a + g.monto, 0);
    const partidas = pres?.partidas || [];
    const sinPres = [...new Set(gastos.map(g => g.categoria))].filter(c => !partidas.some(p => p.categoria === c));
    const totP = partidas.reduce((a, p) => a + p.monto, 0), totR = partidas.reduce((a, p) => a + real(p.categoria), 0) + sinPres.reduce((a, c) => a + real(c), 0);
    const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
    el.innerHTML = `<div class="vhead"><div><h1>Presupuesto</h1><p>Planifica el mes y compara contra lo que realmente se vende y se gasta.</p></div>
      <div class="acts"><input class="input" type="month" value="${mes}" data-mes style="width:auto" aria-label="Mes"><button class="btn" data-edit>${ic("i-edit")}<span class="lbl">${pres ? "Editar presupuesto" : "Crear presupuesto"}</span></button><button class="btn pri" data-gasto>${ic("i-plus")}<span class="lbl">Registrar gasto</span></button></div></div>
      ${!pres ? `<div class="note" style="margin-bottom:16px">${ic("i-alert")}<span>No hay presupuesto para ${mesLargo(mes)}. ${prevP ? "Puedes crearlo copiando las partidas de " + mesLargo(prevP.mes) + "." : "Crea uno para empezar a medir."}</span></div>` : ""}
      <div class="kpis">
        <div class="kpi feature"><span class="lbl">Ventas vs. meta</span><span class="val">${pct(vReal, pres?.metaVentas)}%</span><span class="delta">${money(vReal)} de ${money(pres?.metaVentas || 0)}</span></div>
        <div class="kpi"><span class="lbl">Gasto presupuestado</span><span class="val">${money(totP)}</span><span class="delta muted">${partidas.length} partidas</span></div>
        <div class="kpi"><span class="lbl">Gasto ejecutado</span><span class="val">${money(totR)}</span><span class="delta ${totR > totP && totP ? "down" : "muted"}">${pct(totR, totP)}% del presupuesto</span></div>
        <div class="kpi"><span class="lbl">Disponible</span><span class="val ${totP - totR < 0 ? "down" : ""}">${money(totP - totR)}</span><span class="delta muted">Resultado estimado ${money(vReal - totR)}</span></div></div>
      <div class="dash"><section class="panel"><header><h2>Partidas de ${mesLargo(mes)}</h2></header>
        ${partidas.length || sinPres.length ? `<div class="bars">${partidas.map(p => { const r = real(p.categoria), k = pct(r, p.monto); return `<div class="bar-row"><div class="t"><span>${esc(p.categoria)}</span><span class="num ${k > 100 ? "down" : "muted"}">${money(r)} / ${money(p.monto)} · ${k}%</span></div><div class="track"><i style="width:${Math.min(100, k)}%;background:${k > 100 ? "var(--chili)" : k > 85 ? "var(--sun)" : "var(--brand)"}"></i></div></div>`; }).join("")}
          ${sinPres.map(c => `<div class="bar-row"><div class="t"><span>${esc(c)} <span class="chip warn plain">Sin presupuesto</span></span><span class="num down">${money(real(c))}</span></div><div class="track"><i style="width:100%;background:var(--chili)"></i></div></div>`).join("")}</div>
          <p class="small muted" style="margin:14px 0 0">“Compras de mercancía” se toma automáticamente de las compras registradas.</p>` : `<div class="empty">Sin partidas todavía.</div>`}</section>
        <section class="panel flush"><header><h2>Gastos del mes</h2><span class="small muted">${gastos.length}</span></header><div class="feed">${pg.slice(gastos).map(g => `<a data-g="${g.id}"><span class="ic" style="background:var(--surface-2)">${ic("i-cash")}</span><span><b>${esc(g.descripcion || g.categoria)}</b><small>${esc(g.categoria)} · ${fdate(g.fecha)}</small></span><span class="num" style="font-weight:700">${money(g.monto)}</span></a>`).join("") || `<div class="empty">Aún no hay gastos en este mes.</div>`}</div><div style="padding:0 14px">${pg.html(gastos.length)}</div></section></div>`;
    $("[data-mes]", el).onchange = e => { if (e.target.value) { mes = e.target.value; pg.reset(); draw(); } };
    $("[data-gasto]", el).onclick = () => gastoForm(null, [...partidas.map(p => p.categoria).filter(c => c !== "Compras de mercancía"), ...sinPres], draw);
    $$("[data-g]", el).forEach(a => a.onclick = () => gastoForm(store.get("gastos", a.dataset.g), partidas.map(p => p.categoria).filter(c => c !== "Compras de mercancía"), draw));
    $("[data-edit]", el).onclick = () => presForm(pres || { mes, metaVentas: prevP?.metaVentas || 0, partidas: JSON.parse(JSON.stringify(prevP?.partidas || [{ categoria: "Compras de mercancía", monto: 0 }, { categoria: "Nómina", monto: 0 }])) }, draw);
  };
  pg.bind(el, () => draw());
  draw();
};

/* ---------------- Cierre de caja ---------------- */
VIEWS.caja = el => {
  let dia = S.cajaDia || today(); const pgH = pager("cajas", [10, 25]);
  const draw = () => {
    S.cajaDia = dia;

    store.all("gastos").filter(g => g.fecha === dia).forEach(g => movs.push({ tipo: "Egreso", doc: "Gasto: " + (g.descripcion || g.categoria), quien: g.categoria, metodo: g.metodo || "Efectivo", moneda: "DOP", monto: g.monto, dop: g.monto, usuario: g.usuario }));
    store.all("compras").filter(c => c.estado !== "Anulada" && c.fecha === dia && c.condicion === "Contado").forEach(c => movs.push({ tipo: "Egreso", doc: "Compra #" + c.num, quien: proveedor(c.proveedorId).nombre, metodo: c.metodo || "Efectivo", moneda: "DOP", monto: c.total, dop: c.total, usuario: c.usuario }));

/* ---------------- DGII 606 / 607 ---------------- */
const soloDig = s => String(s || "").replace(/\D/g, "");
const tipoId = rnc => { const d = soloDig(rnc); return d.length === 9 ? "1" : d.length === 11 ? "2" : d ? "3" : ""; };
const esLocal = c => !c?.pais || norm(c.pais).includes("dominicana");
const idDGII = c => esLocal(c) ? soloDig(c?.rnc) : "";
const ymd = s => (s || "").replace(/-/g, "");
const n2 = n => (Math.round((+n || 0) * 100) / 100).toFixed(2);
function dgiiData(tipo, mes) {
  const T = store.config.tasa;
  if (tipo === "607") {
    const rows = [];
    store.all("ventas").filter(v => v.estado !== "Anulada" && ym(v.fecha) === mes && v.ncf).forEach(v => {
      const k = v.moneda === "USD" ? v.tasa || T : 1; const c = cliente(v.clienteId); const ini = (v.abonos || [])[0];
      const pago = { ef: 0, tr: 0, ta: 0, cr: 0 }; const tot = r2(v.total * k);
      if (v.condicion === "Crédito") pago.cr = tot; else { const m = ini?.metodo || "Efectivo"; pago[m === "Efectivo" ? "ef" : m === "Tarjeta" ? "ta" : "tr"] = tot; }
      rows.push({ rnc: idDGII(c), tid: tipoId(idDGII(c)), ncf: v.ncf, mod: "", ti: "01", fecha: ymd(v.fecha), monto: r2(v.subtotal * k), itbis: r2(v.itbis * k), ...pago, cliente: c.nombre, doc: "Factura #" + v.num });
    });
    store.all("notas").filter(n => n.estado !== "Anulada" && ym(n.fecha) === mes && n.ncf).forEach(n => { const k = n.moneda === "USD" ? n.tasa || T : 1; const c = cliente(n.clienteId); rows.push({ rnc: idDGII(c), tid: tipoId(idDGII(c)), ncf: n.ncf, mod: n.ncfModificado || "", ti: "01", fecha: ymd(n.fecha), monto: r2(n.subtotal * k), itbis: r2(n.itbis * k), ef: 0, tr: 0, ta: 0, cr: 0, otras: r2(n.total * k), cliente: c.nombre, doc: "NC #" + n.num }); });
    const sin = store.all("ventas").filter(v => v.estado !== "Anulada" && ym(v.fecha) === mes && !v.ncf).length;
    const line = r => [r.rnc, r.tid, r.ncf, r.mod, r.ti, r.fecha, "", n2(r.monto), n2(r.itbis), n2(0), n2(0), n2(0), n2(0), n2(0), n2(0), n2(0), n2(r.ef), n2(r.tr), n2(r.ta), n2(r.cr), n2(0), n2(0), n2(r.otras || 0)].join("|");
    return { rows, sin, line, header: `607|${soloDig(store.config.rnc)}|${mes.replace("-", "")}|${rows.length}` };
  }

}

  const colStyles = {}; cols.forEach(([cc], j) => { if (cc.r) colStyles[j] = { halign: "right" }; });
  doc.autoTable({

async function excelReport(R) {

  const cols = repCols(R); const c = store.config;
