function roleForm(r) {
  const nuevo = !r; r = r ? JSON.parse(JSON.stringify(r)) : { nombre: "", desc: "", permisos: ["dashboard"] };
  const locked = !!r.sistema; const has = k => locked || k === "dashboard" || r.permisos.includes(k);
  const users = store.all("usuarios").filter(u => u.rol === r.nombre).length;
  const m = modal({ title: nuevo ? "Nuevo rol" : "Rol: " + r.nombre, size: "wide", body: `<form class="grid" data-f>
    ${locked ? `<div class="note ok">${ic("i-shield")}<span>El rol Propietario es del sistema: siempre tiene todos los permisos para que nunca se pierda el acceso a la administración. Puedes cambiar su descripción.</span></div>` : ""}
    <div class="grid g2"><label class="field"><span>Nombre del rol</span><input class="input" name="nombre" value="${esc(r.nombre)}" ${locked ? "readonly" : ""} placeholder="Ej. Supervisor de empaque"></label>
    <label class="field"><span>Descripción</span><input class="input" name="desc" value="${esc(r.desc || "")}" placeholder="Qué hace este rol"></label></div>
    ${PERMS.map((g, gi) => `<section class="panel" style="padding:14px"><header style="margin-bottom:10px"><h3>${g.g}</h3>${locked ? "" : `<button type="button" class="btn sm ghost" data-all="${gi}">Marcar todo</button>`}</header>
      <div class="grid g2" style="gap:10px 18px">${g.items.map(([k, l]) => `<label class="switch"><input type="checkbox" data-perm="${k}" data-g="${gi}" ${has(k) ? "checked" : ""} ${locked || k === "dashboard" ? "disabled" : ""}> <span>${l}${PERM_NEEDS[k] ? `<br><small class="muted">Requiere ${PERMS[0].items.find(x => x[0] === PERM_NEEDS[k])[1]}</small>` : ""}</span></label>`).join("")}</div></section>`).join("")}
    ${!nuevo ? `<p class="small muted" style="margin:0">${users} ${users === 1 ? "usuario tiene" : "usuarios tienen"} este rol. Los cambios se aplican la próxima vez que abran una pantalla.</p>` : ""}</form>`,
    foot: `${!nuevo && !locked ? `<button class="btn danger" data-del style="margin-right:auto">${ic("i-trash")}Eliminar rol</button>` : ""}<button class="btn" data-close>Cancelar</button><button class="btn pri" data-save>${nuevo ? "Crear rol" : "Guardar cambios"}</button>` });
  const F = m.$("[data-f]"); const box = k => F.querySelector(`[data-perm="${k}"]`);
  F.addEventListener("change", e => {
    const cb = e.target.closest("[data-perm]"); if (!cb) return; const k = cb.dataset.perm;
    if (cb.checked && PERM_NEEDS[k]) box(PERM_NEEDS[k]).checked = true;
    if (!cb.checked) Object.entries(PERM_NEEDS).forEach(([a, need]) => { if (need === k) box(a).checked = false; });
  });
  $$("[data-all]", m.el).forEach(b => b.onclick = () => { const cbs = $$(`[data-g="${b.dataset.all}"]:not([disabled])`, F); const on = cbs.some(c => !c.checked); cbs.forEach(c => { c.checked = on; c.dispatchEvent(new Event("change", { bubbles: true })); }); b.textContent = on ? "Quitar todo" : "Marcar todo"; });
  m.$("[data-save]").onclick = () => {
    if (!requireFields(F, ["nombre"])) return; const nombre = F.nombre.value.trim(); const old = r.nombre;
    if (store.all("roles").some(x => x.id !== r.id && norm(x.nombre) === norm(nombre))) { F.nombre.classList.add("err"); return toast("Ya existe un rol con ese nombre.", "err"); }
    r.nombre = nombre; r.desc = F.desc.value.trim();
    if (!locked) r.permisos = ["dashboard", ...$$("[data-perm]", F).filter(c => c.checked && c.dataset.perm !== "dashboard").map(c => c.dataset.perm)];
    store.put("roles", r); audit(nuevo ? "Creó" : "Modificó", "Roles", `${r.nombre}: ${r.sistema ? "todos" : r.permisos.length} permisos`);
    if (!nuevo && old !== nombre) store.all("usuarios").filter(u => u.rol === old).forEach(u => { u.rol = nombre; store.put("usuarios", u); if (u.id === S.user.id) S.user.rol = nombre; });
    m.close(); S.usrTab = "roles"; render(); toast(nuevo ? "Rol creado" : "Rol actualizado");
  };
  m.$("[data-del]")?.addEventListener("click", async () => {
    if (users) return toast(`No se puede eliminar: ${users} ${users === 1 ? "usuario tiene" : "usuarios tienen"} este rol. Cámbiales el rol primero.`, "err");
    if (await confirmBox(`Se eliminará el rol ${esc(r.nombre)}.`, { ok: "Eliminar rol", danger: true })) { store.del("roles", r.id); audit("Eliminó", "Roles", r.nombre); m.close(); route(); toast("Rol eliminado"); }
  });
}
function userForm(u) {
  const nuevo = !u; u = u ? { ...u } : { nombre: "", email: "", rol: store.all("roles").find(r => !r.sistema)?.nombre || "Propietario", activo: true };
  const lockOwner = !isOwner() && u.rol === "Propietario";
  if (lockOwner) return toast("Solo un propietario puede modificar a otro propietario.", "err");
  const m = modal({ title: nuevo ? "Nuevo usuario" : u.nombre, body: `<form class="grid" data-f><div class="grid g2"><label class="field"><span>Nombre completo</span><input class="input" name="nombre" value="${esc(u.nombre)}"></label><label class="field"><span>Correo</span><input class="input" type="email" name="email" value="${esc(u.email)}" autocomplete="off"></label></div>
    <div class="field"><span>Rol</span><div class="grid" style="gap:8px">${store.all("roles").map(r => { const dis = r.sistema && !isOwner(); return `<label style="display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;cursor:${dis ? "not-allowed" : "pointer"};opacity:${dis ? .5 : 1}"><input type="radio" name="rol" value="${esc(r.nombre)}" ${u.rol === r.nombre ? "checked" : ""} ${dis ? "disabled" : ""} style="margin-top:4px"><span><b>${esc(r.nombre)}</b><br><small class="muted">${esc(r.desc || "")}</small></span></label>`; }).join("")}</div></div>
    ${!cloud.on ? `<label class="field"><span>${nuevo ? "Contraseña" : "Nueva contraseña (deja vacío para no cambiarla)"}</span><input class="input" type="password" name="pass" autocomplete="new-password"></label>` : ""}
    <label class="switch"><input type="checkbox" name="activo" ${u.activo ? "checked" : ""}> Puede entrar al sistema</label></form>`,
    foot: `${!nuevo && u.id !== S.user.id && can("eliminar") ? `<button class="btn danger" data-del style="margin-right:auto">${ic("i-trash")}Eliminar</button>` : ""}<button class="btn" data-close>Cancelar</button><button class="btn pri" data-save>${nuevo ? "Crear usuario" : "Guardar cambios"}</button>` });
  const F = m.$("[data-f]");
  const ownersLeft = (excl) => store.all("usuarios").filter(x => x.id !== excl && x.rol === "Propietario" && x.activo).length;
  m.$("[data-save]").onclick = async () => {
    if (!requireFields(F, ["nombre", "email"])) return; const d = formData(F); d.email = d.email.toLowerCase();
    if (!d.rol) return toast("Elige un rol.", "err");
    if (store.all("usuarios").some(x => x.email.toLowerCase() === d.email && x.id !== u.id)) return toast("Ya existe un usuario con ese correo.", "err");
    if (!cloud.on && nuevo && !d.pass) return toast("Asigna una contraseña.", "err");
    if (u.rol === "Propietario" && (d.rol !== "Propietario" || !d.activo) && !ownersLeft(u.id)) return toast("Debe quedar al menos un propietario activo.", "err");
    const o = { ...u, nombre: d.nombre, email: d.email, rol: d.rol, activo: d.activo }; if (d.pass) o.passHash = await sha(d.pass);
    store.put("usuarios", o); audit(nuevo ? "Creó" : "Modificó", "Usuarios", `${o.nombre} (${o.email}) · rol ${o.rol}${o.activo ? "" : " · inactivo"}`); m.close(); if (o.id === S.user.id) { S.user = o; render(); } else route(); toast(nuevo ? "Usuario creado" : "Usuario actualizado");
  };
  m.$("[data-del]")?.addEventListener("click", async () => {
    if (u.rol === "Propietario" && !ownersLeft(u.id)) return toast("Debe quedar al menos un propietario activo.", "err");
    if (await confirmBox(`${esc(u.nombre)} ya no podrá entrar. Sus documentos se conservan.`, { ok: "Eliminar usuario", danger: true })) { store.del("usuarios", u.id); audit("Eliminó", "Usuarios", u.email); m.close(); route(); toast("Usuario eliminado"); }
  });
}

  $$("[data-seq]", el).forEach(tr => tr.onclick = () => seqForm(store.get("ncf", tr.dataset.seq)));
  $("[data-sal]", el)?.addEventListener("click", e => { e.preventDefault(); const d = formData($("[data-al]", el)); store.setConfig({ alertas: d }); audit("Modificó", "Configuración", "Alertas de stock"); toast("Alertas guardadas"); });
  $("[data-test]", el)?.addEventListener("click", () => { const L = lowStock(); if (!L.length) return toast("No hay productos con stock bajo ahora mismo."); const d = formData($("[data-al]", el)); store.setConfig({ alertas: d }); alertaStock(L); });
  $("[data-theme-seg]", el)?.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; lsSet("theme", b.dataset.v); applyTheme(); render(); });
  $("[data-conn]", el)?.addEventListener("click", e => { e.preventDefault(); const d = formData($("[data-sb]", el)); if (!/^https:\/\/.+/.test(d.url) || d.key.length < 20) return toast("Revisa la URL (https://…supabase.co) y la clave anon.", "err"); lsSet("sb", d); lsSet("session", null); location.reload(); });
  $("[data-disc]", el)?.addEventListener("click", async () => { if (await confirmBox("Se dejará de usar la nube en este dispositivo y volverás al modo local.", { ok: "Desconectar" })) { try { await cloud.sb?.auth.signOut(); } catch {} lsSet("sb", null); location.reload(); } });
  $("[data-seedcloud]", el)?.addEventListener("click", async () => {
    if (!await confirmBox("Se agregarán productos, clientes, proveedores y documentos de ejemplo a la base en la nube.", { ok: "Cargar ejemplo" })) return;
    const me = S.user; seed(); const ex = store.all("usuarios").find(x => x.email === me.email); store.data.usuarios = store.all("usuarios").filter(x => x.email !== me.email); store.data.usuarios.push(me);
    try { const n = await cloud.pushAll(); toast(`${n} registros cargados`); render(); } catch (x) { toast("No se pudo cargar: " + x.message, "err"); }
  });
  $("[data-exp]", el)?.addEventListener("click", () => downloadText(`respaldo-${norm(c.empresa).replace(/\W+/g, "-")}-${today()}.json`, JSON.stringify({ app: "kplagro", version: 1, fecha: new Date().toISOString(), config: store.config, data: store.data }), "application/json"));
  $("[data-imp]", el)?.addEventListener("change", async e => {
    const f = e.target.files[0]; if (!f) return;
    try { const j = JSON.parse(await f.text()); if (!j.data || !j.data.productos) throw new Error("formato");
      if (!await confirmBox("Se reemplazará toda la información actual por la del respaldo.", { ok: "Restaurar", danger: true })) return;
      store.data = j.data; store.config = { ...defaultConfig(), ...j.config }; COLS.forEach(k => store.data[k] ||= []); store.save();
      if (cloud.on) await cloud.pushAll();
      const me = store.all("usuarios").find(x => x.email === S.user.email); if (me) S.user = me; render(); toast("Respaldo restaurado");
    } catch { toast("El archivo no es un respaldo válido de este sistema.", "err"); }
  });
  $("[data-reset]", el)?.addEventListener("click", async () => { if (await confirmBox("Se borrará todo lo de este navegador y se cargarán los datos de ejemplo.", { ok: "Restablecer", danger: true })) { seed(); lsSet("session", null); S.user = null; location.hash = ""; render(); toast("Demostración restablecida"); } });
};

function seqForm(q) {
  const nuevo = !q; const modo = store.config.ncfModo === "E" ? "E" : "B";
  q = q ? { ...q } : { tipo: modo === "E" ? "E31" : "B01", desde: 1, hasta: 500, actual: 1, vence: addDays(today(), 365), activo: true };
  const m = modal({ title: nuevo ? "Nueva secuencia de comprobantes" : "Secuencia " + q.tipo, body: `<form class="grid" data-f><label class="field"><span>Tipo</span><select class="input" name="tipo" ${nuevo ? "" : "disabled"}>${Object.entries(NCF_TIPOS).map(([k, l]) => `<option value="${k}" ${q.tipo === k ? "selected" : ""}>${k} · ${l}</option>`).join("")}</select></label>
    <div class="grid g3"><label class="field"><span>Desde</span><input class="input" type="number" min="1" name="desde" value="${q.desde}"></label><label class="field"><span>Hasta</span><input class="input" type="number" min="1" name="hasta" value="${q.hasta}"></label><label class="field"><span>Próximo a usar</span><input class="input" type="number" min="1" name="actual" value="${q.actual}"></label></div>
    <label class="field"><span>Vence</span><input class="input" type="date" name="vence" value="${q.vence || ""}"></label>
    <label class="switch"><input type="checkbox" name="activo" ${q.activo !== false ? "checked" : ""}> Secuencia activa</label><p class="small muted" data-prev style="margin:0"></p></form>`,
    foot: `${!nuevo && can("eliminar") ? `<button class="btn danger" data-del style="margin-right:auto">${ic("i-trash")}</button>` : ""}<button class="btn" data-close>Cancelar</button><button class="btn pri" data-save>${nuevo ? "Agregar" : "Guardar"}</button>` });
  const F = m.$("[data-f]"); const prev = () => { const t = F.tipo.value; m.$("[data-prev]").textContent = `Así se verá: ${fmtNCF(t, +F.actual.value || 1)}`; }; F.addEventListener("input", prev); F.addEventListener("change", prev); prev();
  m.$("[data-save]").onclick = () => { const d = formData(F); d.tipo = F.tipo.value; ["desde", "hasta", "actual"].forEach(k => d[k] = +d[k]); if (!(d.desde >= 1 && d.hasta >= d.desde && d.actual >= d.desde && d.actual <= d.hasta + 1)) return toast("Revisa el rango: desde ≤ próximo ≤ hasta.", "err");
    store.put("ncf", { ...q, ...d }); audit(nuevo ? "Agregó" : "Modificó", "Comprobantes", `${d.tipo} ${fmtNCF(d.tipo, d.desde)} – ${fmtNCF(d.tipo, d.hasta)}`); m.close(); route(); toast("Secuencia guardada"); };
  m.$("[data-del]")?.addEventListener("click", async () => { if (await confirmBox("Se eliminará esta secuencia.", { ok: "Eliminar", danger: true })) { store.del("ncf", q.id); m.close(); route(); } });
}

/* ---------------- Arranque ---------------- */
async function registerPWA() {
  try {
    const r = await fetch("manifest.webmanifest", { method: "HEAD", cache: "no-store" }); if (!r.ok) return;
    const l = document.createElement("link"); l.rel = "manifest"; l.href = "manifest.webmanifest"; document.head.append(l);
    const a = document.createElement("link"); a.rel = "apple-touch-icon"; a.href = "icon-192.png"; document.head.append(a);
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  } catch {}
}
(async () => {
  applyTheme(); store.load();
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { if (lsGet("theme", "system") === "system" && S.user) render(); });
  const t0 = Date.now();
  await cloud.init(); await restoreSession(); render(); registerPWA();
  try { await Promise.race([document.fonts?.ready, new Promise(r => setTimeout(r, 1500))]); } catch {}
  setTimeout(() => { const sp = $("#splash"); if (sp) { sp.classList.add("out"); setTimeout(() => sp.remove(), 400); } }, Math.max(0, 500 - (Date.now() - t0)));
})();
</script>
